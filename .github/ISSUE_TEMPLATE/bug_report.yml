name: Bug report
description: Report incorrect wtgc behavior.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, Git state, and a minimal repository shape if possible.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Safety impact
      options:
        - No deletion risk
        - Incorrectly kept worktree
        - Incorrectly marked removable
        - Unexpected deletion
        - Unsure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - wtgc version:
        - Go version:
        - OS:
        - Git version:
    validations:
      required: true
