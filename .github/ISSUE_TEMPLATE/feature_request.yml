name: Feature request
description: Request new wtgc behavior.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: job
    attributes:
      label: Job to be done
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should wtgc do?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: How should this avoid deleting or hiding useful work?
    validations:
      required: true
