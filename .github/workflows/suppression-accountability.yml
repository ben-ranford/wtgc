name: suppression accountability

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Account for newly added suppressions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { trackSuppressions } = require('${{ github.workspace }}/scripts/suppression-accountability.js');
            await trackSuppressions(github, context);
