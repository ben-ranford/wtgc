name: release

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to publish.
        required: true
        type: string
      sha:
        description: Commit SHA to build and publish.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish.
        required: true
        type: string
      sha:
        description: Commit SHA to build and publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    name: release checks
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Verify tag points to release SHA
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: sh ./scripts/verify-release-ref.sh "$RELEASE_TAG" "$RELEASE_SHA"
      - name: Run CI target
        run: make ci

  build:
    needs: test
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Verify tag points to release SHA
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: sh ./scripts/verify-release-ref.sh "$RELEASE_TAG" "$RELEASE_SHA"
      - name: Resolve release metadata
        id: metadata
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          echo "date=$(git show -s --format=%cI "$RELEASE_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build artifact
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          make release \
            VERSION="$RELEASE_TAG" \
            COMMIT='${{ inputs.sha }}' \
            BUILD_DATE='${{ steps.metadata.outputs.date }}' \
            PLATFORMS='${{ matrix.goos }}/${{ matrix.goarch }}'
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wtgc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify tag points to release SHA
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: sh ./scripts/verify-release-ref.sh "$RELEASE_TAG" "$RELEASE_SHA"
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/artifacts
      - name: Prepare release assets
        run: ./scripts/flatten-release-artifacts.sh dist/artifacts dist/release
      - name: Generate release SBOM
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/release
          format: spdx-json
          output-file: dist/release/wtgc_${{ env.RELEASE_TAG }}_sbom.spdx.json
          artifact-name: wtgc-${{ inputs.tag_name }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Rebuild checksums with SBOM
        run: |
          ./scripts/checksums.sh dist/release
          ./scripts/validate-release-artifacts.sh dist/release
      - name: Attest release asset provenance
        if: ${{ github.event.repository.private == false || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release/checksums.txt
      - name: Attest release SBOM
        if: ${{ github.event.repository.private == false || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.zip
          sbom-path: dist/release/wtgc_${{ inputs.tag_name }}_sbom.spdx.json
      - name: Publish GitHub release with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh ./scripts/publish-release-assets.sh "${{ inputs.tag_name }}" dist/release
