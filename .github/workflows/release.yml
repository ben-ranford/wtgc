name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: release checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install make (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: choco install make --no-progress -y
      - name: Run CI target
        run: make ci

  build:
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
          - runner: ubuntu-latest
            goos: windows
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build artifact
        run: |
          make release VERSION=${GITHUB_REF_NAME} PLATFORMS="${{ matrix.goos }}/${{ matrix.goarch }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: wtgc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Merge checksums
        run: |
          find dist -name checksums.txt -print0 | xargs -0 cat | sort -u > dist/checksums-merged.txt
          mv dist/checksums-merged.txt dist/checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
