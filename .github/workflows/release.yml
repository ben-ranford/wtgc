name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: release checks
    runs-on: wtgc-arc
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Bootstrap ARC runner tools
        run: ./scripts/bootstrap-runner-tools.sh make ruby tar
      - name: Run CI target
        run: make ci

  build:
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: wtgc-arc
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Bootstrap ARC runner tools
        run: ./scripts/bootstrap-runner-tools.sh make tar zip
      - name: Build artifact
        run: |
          make release VERSION=${GITHUB_REF_NAME} PLATFORMS="${{ matrix.goos }}/${{ matrix.goarch }}"
      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wtgc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: wtgc-arc
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist/artifacts
      - name: Bootstrap ARC runner tools
        run: ./scripts/bootstrap-runner-tools.sh gh
      - name: Prepare release assets
        run: |
          ./scripts/flatten-release-artifacts.sh dist/artifacts dist/release
      - name: Publish GitHub release with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes --verify-tag
          fi
