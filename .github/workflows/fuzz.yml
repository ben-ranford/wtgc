name: fuzz

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  porcelain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/gitx -run '^$' -fuzz '^FuzzParseWorktreeListPorcelainZ$' -fuzztime=30s
      - run: go test ./internal/gitx -run '^$' -fuzz '^FuzzDiscoverRootInput$' -fuzztime=30s
