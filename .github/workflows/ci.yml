name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Install make (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: choco install make --no-progress -y

      - name: Run CI target
        run: make ci

      - name: Run automation checks
        if: ${{ runner.os == 'Linux' }}
        run: make release-check VERSION=ci-check PLATFORMS="linux/amd64"
