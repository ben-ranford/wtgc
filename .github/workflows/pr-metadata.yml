name: pr metadata

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to validate.
        required: true
        type: string

jobs:
  validate:
    name: pr-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Write PR body
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const pullRequest = context.payload.pull_request || (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(context.payload.inputs?.['pr-number']),
            })).data;
            if (context.eventName === 'workflow_dispatch' && (pullRequest.head.sha !== process.env.GITHUB_SHA || pullRequest.head.ref !== process.env.GITHUB_REF_NAME)) {
              throw new Error('dispatched PR must match the workflow ref and SHA');
            }
            if (pullRequest.labels.length === 0) {
              core.setFailed('Pull requests must have at least one label.');
            }
            const bodyPath = path.join(process.env.RUNNER_TEMP, 'pr-body.md');
            fs.writeFileSync(bodyPath, pullRequest.body || '', 'utf8');
            core.exportVariable('PR_BODY_FILE', bodyPath);
            core.exportVariable('PR_TITLE', pullRequest.title || '');
            core.exportVariable('PR_HEAD_REF', pullRequest.head.ref || '');
            core.exportVariable('PR_HEAD_REPO_FULL_NAME', pullRequest.head.repo?.full_name || '');
            core.exportVariable('PR_AUTHOR_LOGIN', pullRequest.user.login || '');
            core.exportVariable('REPOSITORY_FULL_NAME', context.repo.owner + '/' + context.repo.repo);

      - name: Read Release Please identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const { data: user } = await github.rest.users.getAuthenticated();
            core.exportVariable('RELEASE_PLEASE_AUTHOR_LOGIN', user.login);

      - name: Read repository merge policy
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const eventRepo = context.payload.repository || {};
            const firstDefined = (...values) => values.find((value) => value !== undefined && value !== null);
            core.exportVariable('REPO_ALLOW_MERGE_COMMIT', String(firstDefined(repo.allow_merge_commit, repo.allowMergeCommit, eventRepo.allow_merge_commit, eventRepo.allowMergeCommit, '')));
            core.exportVariable('REPO_ALLOW_REBASE_MERGE', String(firstDefined(repo.allow_rebase_merge, repo.allowRebaseMerge, eventRepo.allow_rebase_merge, eventRepo.allowRebaseMerge, '')));
            core.exportVariable('REPO_ALLOW_SQUASH_MERGE', String(firstDefined(repo.allow_squash_merge, repo.allowSquashMerge, eventRepo.allow_squash_merge, eventRepo.allowSquashMerge, '')));
            core.exportVariable('REPO_SQUASH_MERGE_COMMIT_TITLE', String(firstDefined(repo.squash_merge_commit_title, repo.squashMergeCommitTitle, eventRepo.squash_merge_commit_title, eventRepo.squashMergeCommitTitle, '')));

      - name: Validate PR metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const titlePattern = /^(feat|fix|perf|docs|refactor|revert|test|ci|build|chore)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^\s].+$/;
            const releaseTitlePattern = /^chore: release [0-9]+\.[0-9]+\.[0-9]+$/;
            const releaseHeadRefPattern = /^release-please--branches--main(?:--components--[a-z0-9._-]+)?$/;
            const requiredHeadings = ['Problem', 'Changes', 'Validation', 'Compatibility And Safety', 'Notes'];
            const requiredSafetyFields = ['Worktree deletion behavior', 'JSON schema or output changes', 'Migration or release impact'];
            const placeholders = [
              'What user-visible problem or engineering risk does this address?',
              'Commands and checks run:',
              'Anything reviewers should pay special attention to?',
            ];
            const stripCodeFences = (content) => {
              let inFence = false;
              return content.split('\n').filter((line) => {
                if (line.trimStart().startsWith('```')) {
                  inFence = !inFence;
                  return false;
                }
                return !inFence;
              }).join('\n');
            };
            const stripHTMLComments = (content) => content.replace(/<!--[\s\S]*?-->/g, '');
            const meaningful = (content) => stripHTMLComments(stripCodeFences(content))
              .split('\n')
              .map((line) => line.trim())
              .some((line) => line !== '' && line !== '-' && !placeholders.includes(line));
            const sections = new Map();
            let section = '';
            let content = [];
            let inFence = false;
            const flush = () => {
              if (section) sections.set(section, content.join('\n').trim());
              content = [];
            };
            for (const line of fs.readFileSync(process.env.PR_BODY_FILE, 'utf8').split('\n')) {
              if (line.trimStart().startsWith('```')) inFence = !inFence;
              if (!inFence && line.startsWith('## ') && !line.startsWith('### ')) {
                flush();
                section = line.slice(3).trim();
              } else if (section) {
                content.push(line);
              }
            }
            flush();
            const failures = [];
            if (!titlePattern.test(process.env.PR_TITLE || '')) {
              failures.push('PR title must use the approved Conventional Commit format.');
            }
            const trustedReleasePlease = releaseHeadRefPattern.test(process.env.PR_HEAD_REF || '') &&
              releaseTitlePattern.test(process.env.PR_TITLE || '') &&
              process.env.PR_HEAD_REPO_FULL_NAME === process.env.REPOSITORY_FULL_NAME &&
              process.env.RELEASE_PLEASE_AUTHOR_LOGIN !== '' &&
              process.env.RELEASE_PLEASE_AUTHOR_LOGIN === process.env.PR_AUTHOR_LOGIN;
            if (!trustedReleasePlease) {
              for (const heading of requiredHeadings) {
                const value = sections.get(heading);
                if (value === undefined) failures.push(`PR body is missing required template section "${heading}".`);
                else if (heading !== 'Notes' && !meaningful(value)) failures.push(`PR section "${heading}" must be completed.`);
              }
              const safety = sections.get('Compatibility And Safety') || '';
              for (const field of requiredSafetyFields) {
                const match = stripHTMLComments(stripCodeFences(safety)).match(new RegExp(`^\\-\\s*${field.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')}:\\s*(.+)$`, 'm'));
                if (!match || !meaningful(match[1])) failures.push(`Compatibility And Safety field "${field}" must be filled.`);
              }
            }
            const policy = [
              [process.env.REPO_ALLOW_SQUASH_MERGE, 'true', 'Repository must allow squash merges.'],
              [process.env.REPO_ALLOW_MERGE_COMMIT, 'false', 'Repository must disable merge commits.'],
              [process.env.REPO_ALLOW_REBASE_MERGE, 'false', 'Repository must disable rebase merges.'],
              [process.env.REPO_SQUASH_MERGE_COMMIT_TITLE, 'PR_TITLE', 'Repository squash merge titles must default to the PR title.'],
            ];
            for (const [actual, expected, message] of policy) {
              if (actual !== expected) failures.push(`${message} Expected "${expected}", got "${actual || ''}".`);
            }
            if (failures.length > 0) core.setFailed(failures.join('\n'));
