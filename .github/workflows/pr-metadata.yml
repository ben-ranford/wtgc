name: pr metadata

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to validate.
        required: true
        type: string

jobs:
  validate:
    name: pr-metadata
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.0'

      - name: Write PR body
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const pullRequest = context.payload.pull_request || (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(context.payload.inputs?.['pr-number']),
            })).data;
            if (context.eventName === 'workflow_dispatch' && (pullRequest.head.sha !== process.env.GITHUB_SHA || pullRequest.head.ref !== process.env.GITHUB_REF_NAME)) {
              throw new Error('dispatched PR must match the workflow ref and SHA');
            }
            const renovatePullRequest = pullRequest.user.login === 'renovate[bot]';
            const validationTitle = pullRequest.title || '';
            const validationBody = renovatePullRequest ? [
              '## Problem', 'N/A',
              '## Changes', 'N/A',
              '## Validation', 'N/A',
              '## Compatibility And Safety',
              '- Worktree deletion behavior: N/A',
              '- JSON schema or output changes: N/A',
              '- Migration or release impact: N/A',
              '## Notes', 'N/A',
            ].join('\n') : pullRequest.body || '';
            const bodyPath = path.join(process.env.RUNNER_TEMP, 'pr-body.md');
            fs.writeFileSync(bodyPath, validationBody, 'utf8');
            core.exportVariable('PR_BODY_FILE', bodyPath);
            core.exportVariable('PR_TITLE', validationTitle);
            core.exportVariable('PR_HEAD_REF', pullRequest.head.ref || '');
            core.exportVariable('PR_HEAD_REPO_FULL_NAME', pullRequest.head.repo?.full_name || '');
            core.exportVariable('PR_AUTHOR_LOGIN', pullRequest.user.login || '');
            core.exportVariable('PR_LABEL_COUNT', String(pullRequest.labels.length));
            core.exportVariable('PR_BASE_SHA', pullRequest.base.sha);
            core.exportVariable('REPOSITORY_FULL_NAME', context.repo.owner + '/' + context.repo.repo);
            core.exportVariable('IS_RELEASE_PLEASE_CANDIDATE', String(
              /^release-please--branches--main(?:--components--[a-z0-9._-]+)?$/.test(pullRequest.head.ref || '') &&
              /^chore: release [0-9]+\.[0-9]+\.[0-9]+$/.test(pullRequest.title || '') &&
              pullRequest.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo,
            ));
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'pr-metadata',
              head_sha: pullRequest.head.sha,
              status: 'in_progress',
              output: {
                title: 'PR metadata validation',
                summary: 'Trusted metadata validation is running.',
              },
            });
            core.exportVariable('PR_METADATA_CHECK_RUN_ID', String(check.id));

      - name: Download trusted validator
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'tools/prcheck/main.go',
              ref: process.env.PR_BASE_SHA,
            });
            if (Array.isArray(file) || file.type !== 'file' || !file.content || file.encoding !== 'base64') {
              throw new Error('trusted metadata validator source was not found');
            }
            const validatorPath = path.join(process.env.RUNNER_TEMP, 'prcheck.go');
            fs.writeFileSync(validatorPath, Buffer.from(file.content, 'base64'));
            core.exportVariable('PRCHECK_PATH', validatorPath);

      - name: Read Release Please identity
        if: env.IS_RELEASE_PLEASE_CANDIDATE == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const { data: user } = await github.rest.users.getAuthenticated();
            core.exportVariable('RELEASE_PLEASE_AUTHOR_LOGIN', user.login);

      - name: Validate PR labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const releasePleaseAuthor = process.env.RELEASE_PLEASE_AUTHOR_LOGIN || '';
            const trustedReleasePlease = process.env.IS_RELEASE_PLEASE_CANDIDATE === 'true' &&
              releasePleaseAuthor !== '' &&
              releasePleaseAuthor === process.env.PR_AUTHOR_LOGIN;
            const automatedMetadataPullRequest = process.env.PR_AUTHOR_LOGIN === 'renovate[bot]' || trustedReleasePlease;
            if (Number(process.env.PR_LABEL_COUNT) === 0 && !automatedMetadataPullRequest) {
              core.setFailed('Pull requests must have at least one label.');
            }

      - name: Read repository merge policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const eventRepo = context.payload.repository || {};
            const firstDefined = (...values) => values.find((value) => value !== undefined && value !== null);
            core.exportVariable('REPO_ALLOW_MERGE_COMMIT', String(firstDefined(repo.allow_merge_commit, repo.allowMergeCommit, eventRepo.allow_merge_commit, eventRepo.allowMergeCommit, '')));
            core.exportVariable('REPO_ALLOW_REBASE_MERGE', String(firstDefined(repo.allow_rebase_merge, repo.allowRebaseMerge, eventRepo.allow_rebase_merge, eventRepo.allowRebaseMerge, '')));
            core.exportVariable('REPO_ALLOW_SQUASH_MERGE', String(firstDefined(repo.allow_squash_merge, repo.allowSquashMerge, eventRepo.allow_squash_merge, eventRepo.allowSquashMerge, '')));
            core.exportVariable('REPO_SQUASH_MERGE_COMMIT_TITLE', String(firstDefined(repo.squash_merge_commit_title, repo.squashMergeCommitTitle, eventRepo.squash_merge_commit_title, eventRepo.squashMergeCommitTitle, '')));

      - name: Validate PR title and template
        id: validate
        continue-on-error: true
        run: go run "$PRCHECK_PATH" --check-repo-policy --title "$PR_TITLE" --head-ref "$PR_HEAD_REF" --head-repo-full-name "$PR_HEAD_REPO_FULL_NAME" --repo-full-name "$REPOSITORY_FULL_NAME" --release-please-author-login "$RELEASE_PLEASE_AUTHOR_LOGIN" --pr-author-login "$PR_AUTHOR_LOGIN" --body-file "$PR_BODY_FILE"

      - name: Publish PR metadata result
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const success = process.env.VALIDATION_OUTCOME === 'success';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.PR_METADATA_CHECK_RUN_ID),
              status: 'completed',
              conclusion: success ? 'success' : 'failure',
              output: {
                title: 'PR metadata validation',
                summary: success ? 'PR metadata is valid.' : 'PR metadata validation failed. See the Validate PR title and template step.',
              },
            });
            if (!success) {
              core.setFailed('PR metadata validation failed.');
            }
